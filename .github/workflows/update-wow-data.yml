name: Update WoW translation data

on:
  workflow_dispatch:
  schedule:
    - cron: "25 * * * *"
  push:
    paths:
      - "scripts/**"
      - "tests/**"
      - "data/manual_overrides.json"
      - "data/mezu_player_glossary.json"
      - "data/wowhead_regression_pages.json"
      - ".github/workflows/update-wow-data.yml"

# Avoid overlapping hourly/manual builds racing to push generated data.
concurrency:
  group: mezu-wow-data-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate local Python and regression tests
        run: |
          python -m compileall -q scripts tests
          python -m unittest discover -s tests -p "test_*.py"

      - name: Build community WoW glossary
        run: python scripts/build_external_glossary.py

      - name: Build Blizzard translation memory
        run: |
          cp data/blizzard_translation_memory.json "$RUNNER_TEMP/blizzard_memory_previous.json"
          python scripts/build_blizzard_memory.py
          python scripts/preserve_blizzard_memory.py "$RUNNER_TEMP/blizzard_memory_previous.json" data/blizzard_translation_memory.json


      - name: Build WoW data pack
        env:
          BLIZZARD_CLIENT_ID: ${{ secrets.BLIZZARD_CLIENT_ID }}
          BLIZZARD_CLIENT_SECRET: ${{ secrets.BLIZZARD_CLIENT_SECRET }}
          BLIZZARD_REGION: eu
        run: python scripts/build_datapack.py

      - name: Validate WoW data pack
        run: python scripts/validate_datapack.py

      - name: Commit changes
        run: |
          if [ -z "$(git status --porcelain -- data/)" ]; then
            echo "No data changes."
            exit 0
          fi
          git config user.name "MEZU Data Bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/
          git commit -m "data: refresh Blizzard EN-FR pack"
          # A source commit can land while the data build is running.
          # Never force-push; rebase once and leave conflicts for the next sync.
          if ! git push; then
            git fetch origin main
            if ! git rebase origin/main; then
              git rebase --abort
              echo "::warning::Data publication conflicted with a newer commit; retry next sync."
              exit 1
            fi
            git push
          fi
