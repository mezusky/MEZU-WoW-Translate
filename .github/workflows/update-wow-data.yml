name: Update WoW translation data

on:
  workflow_dispatch:
  schedule:
    - cron: "25 * * * *"
  push:
    paths:
      - "scripts/**"
      - "data/manual_overrides.json"
      - ".github/workflows/update-wow-data.yml"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build community WoW glossary
        run: python scripts/build_external_glossary.py

      - name: Build Blizzard translation memory
        run: python scripts/build_blizzard_memory.py

      - name: Build WoW data pack
        env:
          BLIZZARD_CLIENT_ID: ${{ secrets.BLIZZARD_CLIENT_ID }}
          BLIZZARD_CLIENT_SECRET: ${{ secrets.BLIZZARD_CLIENT_SECRET }}
          BLIZZARD_REGION: eu
        run: python scripts/build_datapack.py

      - name: Validate WoW data pack
        run: python scripts/validate_datapack.py

      - name: Commit changes
        run: |
          if [ -z "$(git status --porcelain -- data/)" ]; then
            echo "No data changes."
            exit 0
          fi
          git config user.name "MEZU Data Bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/
          git commit -m "data: refresh Blizzard EN-FR pack"
          git push
